name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shitshpejt
          POSTGRES_PASSWORD: shitshpejt
          POSTGRES_DB: shitshpejt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shitshpejt" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://shitshpejt:shitshpejt@localhost:5432/shitshpejt
      TEST_DATABASE_URL: postgresql://shitshpejt:shitshpejt@localhost:5432/shitshpejt_test
      E2E_DATABASE_URL: postgresql://shitshpejt:shitshpejt@localhost:5432/shitshpejt_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE shitshpejt_test"
          psql "$DATABASE_URL" -c "CREATE DATABASE shitshpejt_e2e"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (mobile + desktop)
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

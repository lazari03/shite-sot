name: Deploy

# main -> staging automatically. Production: run manually with the SHA you want (same image, promoted).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      sha:
        description: Git SHA (image tag) to deploy. Defaults to the current commit.
        required: false

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (skipped if this SHA already exists)
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.tag.outputs.tag }}
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then echo "exists: $IMAGE"; exit 0; fi
          docker buildx build -f docker/Dockerfile -t "$IMAGE" --cache-from type=gha --cache-to type=gha,mode=max --push .

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.image.outputs.tag }}
          sparse-checkout: |
            compose.prod.yaml
            docker/Caddyfile
            scripts/deploy.sh
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Ship compose files
        run: |
          scp compose.prod.yaml scripts/deploy.sh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/shitshpejt/"
          scp docker/Caddyfile "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/shitshpejt/docker/Caddyfile"
      - name: Deploy + health check (auto-rollback on failure)
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /opt/shitshpejt && GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' IMAGE_REPO='${GITHUB_REPOSITORY,,}' bash deploy.sh '${{ needs.image.outputs.tag }}'"
      - name: Public health check
        run: curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_URL }}/api/health"

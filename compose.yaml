# Local development services. App runs on the host with `pnpm dev` / `pnpm worker:dev`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shitshpejt
      POSTGRES_PASSWORD: shitshpejt
      POSTGRES_DB: shitshpejt
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data, ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shitshpejt"], interval: 5s, retries: 10 }
volumes:
  pgdata-dev: {}

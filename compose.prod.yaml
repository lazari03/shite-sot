# Production / staging on Hetzner with Supabase PostgreSQL. Usage (from /opt/shitshpejt):
#   TAG=<git-sha> docker compose -f compose.prod.yaml up -d
x-app: &app
  image: ghcr.io/${IMAGE_REPO:-lazari03/shite-sot}:${TAG:?set TAG}
  env_file: .env
  environment:
    LOCAL_STORAGE_DIR: /app/storage
    MODERATION_MODE: all
    REQUIRE_EMAIL_VERIFICATION: "true"
    EMAIL_PROVIDER: resend
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on:
      web: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    volumes: [media:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["worker"]
    environment:
      # Same as x-app (a service-level environment replaces the anchor's), plus pool limits.
      LOCAL_STORAGE_DIR: /app/storage
      MODERATION_MODE: all
      REQUIRE_EMAIL_VERIFICATION: "true"
      EMAIL_PROVIDER: resend
      # Connection budget (Supabase session pooler ≈ 15): web 4+2, worker 2+3, migrate ~2.
      DATABASE_POOL_MAX: "2"
      PGBOSS_POOL_MAX: "3"
    restart: unless-stopped
    volumes: [media:/app/storage]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  media: {}
  caddy_data: {}
  caddy_config: {}

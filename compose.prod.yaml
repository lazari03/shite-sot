# Production / staging on one Hetzner VM. Usage (from /opt/shitshpejt):
#   TAG=<git-sha> docker compose -f compose.prod.yaml up -d
x-app: &app
  image: ghcr.io/${IMAGE_REPO:-lazari03/shite-sot}:${TAG:?set TAG}
  env_file: .env
  environment:
    LOCAL_STORAGE_DIR: /app/storage
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  depends_on:
    postgres: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on:
      web: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    volumes: [media:/app/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    volumes: [media:/app/storage]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.db
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, retries: 20 }
    shm_size: 256mb
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  pgdata: {}
  media: {}
  caddy_data: {}
  caddy_config: {}
